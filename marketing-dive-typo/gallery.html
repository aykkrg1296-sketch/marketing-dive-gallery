<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Typography Pattern Banners — MARKETING DIVE</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; color: #fff; font-family: -apple-system, sans-serif; padding: 40px 20px; }
h1 { text-align: center; font-size: 20px; font-weight: 300; letter-spacing: 0.2em; margin-bottom: 40px; color: #999; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; max-width: 1200px; margin: 0 auto; }
.card { background: #1a1a1a; border-radius: 12px; overflow: hidden; }
.card img { width: 100%; display: block; }
.card .info { padding: 16px; }
.card .num { color: #666; font-size: 12px; letter-spacing: 0.1em; }
.card .name { font-size: 15px; font-weight: 600; margin: 4px 0; }
.card .pattern { font-size: 12px; color: #888; line-height: 1.5; }
.row2 { grid-template-columns: repeat(2, 1fr); max-width: 820px; margin: 24px auto 0; }
</style>
</head>
<body>
<h1>MARKETING DIVE × タイポグラフィの型</h1>
<div class="grid">
  <div class="card">
    <img src="final/banner_01.png" alt="Banner 01">
    <div class="info">
      <div class="num">01</div>
      <div class="name">数字ドカン × メリハリ</div>
      <div class="pattern">構図: 数字ドカン / 加工: メリハリ / Z型</div>
    </div>
  </div>
  <div class="card">
    <img src="final/banner_02.png" alt="Banner 02">
    <div class="info">
      <div class="num">02</div>
      <div class="name">対比構図 × 白黒反転</div>
      <div class="pattern">構図: 対比 / 文字組み: 白黒反転2段 / 対角線型</div>
    </div>
  </div>
  <div class="card">
    <img src="final/banner_03.png" alt="Banner 03">
    <div class="info">
      <div class="num">03</div>
      <div class="name">全面テキスト × 魂の型</div>
      <div class="pattern">構図: 全面テキスト / 魂: コンセプト一体化</div>
    </div>
  </div>
</div>
<div class="grid row2">
  <div class="card">
    <img src="final/banner_04.png" alt="Banner 04">
    <div class="info">
      <div class="num">04</div>
      <div class="name">デカ文字 × 人物シルエット</div>
      <div class="pattern">構図: 人物背面テキスト / 加工: デカ文字 / F型</div>
    </div>
  </div>
  <div class="card">
    <img src="final/banner_05.png" alt="Banner 05">
    <div class="info">
      <div class="num">05</div>
      <div class="name">漢字大+ルビ × 明朝体 × DIVE</div>
      <div class="pattern">文字組み: 漢字大+ルビ上帯 / 書体: 明朝体</div>
    </div>
  </div>
</div>
</body>
</html>
